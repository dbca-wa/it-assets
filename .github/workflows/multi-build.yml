# Builds and pushes the multi-architecture (amd64/arm64) image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
name: Build multi-architecture image

on:
  schedule:
    - cron: '5 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ env.GHCR_IMAGE }}:${{ steps.image_tag.outputs.value }}
    permissions:
      contents: read
      packages: write # push image to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$tag" ]; then
            # strip a leading 'v' (e.g. v1.2.3 -> 1.2.3)
            semtag="${tag#v}"
            echo "value=${semtag}" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push with Docker Buildx
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          push: true
          set: |
            app.tags=${{ env.GHCR_IMAGE }}:latest
            ${{ steps.image_tag.outputs.has_version_tag == 'true' && format('app.tags={0}:{1}', env.GHCR_IMAGE, steps.image_tag.outputs.value) || '' }}

  scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          scan-type: 'image'
          scanners: 'vuln'
          image-ref: ${{ needs.build.outputs.image_ref }}
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-results.sarif'

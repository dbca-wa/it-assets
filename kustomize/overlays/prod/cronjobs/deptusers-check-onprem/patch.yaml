apiVersion: batch/v1
kind: CronJob
metadata:
  name: itassets-cronjob
spec:
  schedule: '20,50 8-19 * * 1-5'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: itassets-cronjob
              args: ['manage.py', 'check_onprem_accounts', '--container', 'azuread', '--path', 'adusers-azdc002.json']
              envFrom:
                - secretRef:
                    name: itassets-env-prod

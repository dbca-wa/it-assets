apiVersion: batch/v1
kind: CronJob
metadata:
  name: itassets-cronjob
spec:
  schedule: '0 6 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: itassets-cronjob
              args: ['manage.py', 'sync_dependabot_alerts']
              envFrom:
                - secretRef:
                    name: itassets-env-prod

apiVersion: batch/v1
kind: CronJob
metadata:
  name: itassets-cronjob
spec:
  schedule: '25 8,10,12,14,16,18,20 * * 1-5'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: itassets-cronjob
              args: ['manage.py', 'department_users_sync_ad_data']
              envFrom:
                - secretRef:
                    name: itassets-env-prod
